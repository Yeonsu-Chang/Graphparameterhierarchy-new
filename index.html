<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph Parameter Hierarchy</title>
  <link rel="stylesheet" href="./styles.css?v=20260505-casefix1" />
  <script src="https://unpkg.com/cytoscape@3.27.0/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <script src="./graph-data.js?v=20260505-casefix1"></script>
  <script defer src="./app.js?v=20260505-casefix1"></script>
</head>
<body>
  <div id="app">
    <aside id="node-panel">
      <div id="node-panel-top">
        <div class="panel-header">
          <h3 id="panel-title">All nodes</h3>
          <button class="panel-close" id="close-node-panel" type="button" aria-label="Close parameter list">×</button>
          <span id="node-count"></span>
        </div>
        <div class="search-stack">
          <div class="search-input-wrap">
            <input
              id="node-filter"
              type="search"
              placeholder="Filter..."
              aria-label="Filter node list"
            />
            <button id="clear-node-filter" class="search-clear" type="button" aria-label="Clear node filter">×</button>
          </div>
          <div class="panel-subline">
            <span id="node-filter-meta">Showing all parameters</span>
            <span id="selected-node-label"></span>
          </div>
        </div>
      </div>
      <ul id="node-panel-list"></ul>
    </aside>

    <main id="main">
      <header>
        <h1 id="page-title">Graph Parameter Hierarchy</h1>
        <button id="fit" class="primary" type="button" style="display:none;">Fit</button>

        <label for="edgeHL" id="highlight-label">k-hierarchy</label>
        <select id="edgeHL">
          <option value="off" selected>Off</option>
          <option value="1">k=1</option>
          <option value="2">k=2</option>
        </select>

        <a id="class-map-link" class="primary header-link" href="./graph-class-example/index.html">Class Map</a>
        <button id="toggle-path-finder" type="button">Path finder</button>
        <button id="toggle-panel" type="button">Parameter list</button>
        <button id="reset" type="button">Reset</button>
        <a id="homepage-link" class="primary homepage-btn" target="_blank" rel="noreferrer">Homepage</a>
      </header>

      <section id="content">
        <section id="graph-stage">
          <section id="cy" aria-label="Graph visualization"></section>
          <div id="mobile-graph-hint" hidden>
            <p>On mobile, use Parameter list or Path finder to show only the relevant part of the graph.</p>
          </div>
        </section>
        <section id="side-panels">
          <aside id="path-panel" class="side-panel">
            <div class="detail-card-header">
              <button class="panel-close" id="close-path-finder" type="button" aria-label="Close path finder">×</button>
              <p class="eyebrow">Path finder</p>
              <h2>Compare two parameters</h2>
            </div>
            <div class="field-stack">
              <label for="path-from">From</label>
              <input id="path-from" type="search" list="node-options" placeholder="Start parameter" />
            </div>
            <div class="field-stack">
              <label for="path-to">To</label>
              <input id="path-to" type="search" list="node-options" placeholder="Target parameter" />
            </div>
            <div class="button-row">
              <button id="find-path" class="primary" type="button">Find path</button>
              <button id="clear-path" type="button">Clear path</button>
            </div>
            <p id="path-result" class="muted">Pick two parameters to trace their shortest connection.</p>
          </aside>
        </section>
      </section>
    </main>
  </div>
  <datalist id="node-options"></datalist>
</body>
</html>
