<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph Class Map</title>
  <link rel="icon" href="../graph-hierarchy-icon.svg?v=20260514" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=20261026-general2" />
  <script src="https://unpkg.com/cytoscape@3.27.0/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <script src="./data.js?v=20261026-allgraphs1"></script>
  <script src="./relation-sources.js?v=20261026-allgraphs1"></script>
  <script src="./complexity-data.js?v=20261026-general2"></script>
  <script defer src="./complexity.js?v=20261026-general2"></script>
  <script defer src="./app.js?v=20261026-audit1"></script>
</head>
<body>
  <main class="shell explorer-shell">
    <header class="topbar">
      <div>
        <h1 id="page-title">Graph Class Map</h1>
      </div>
      <div class="topbar-actions">
        <a class="nav-link" href="../index.html">Parameter Hierarchy</a>
        <p id="graph-count" class="graph-count"></p>
      </div>
    </header>

    <nav class="mobile-view-switch" aria-label="Mobile class map sections">
      <button id="show-class-list" class="active" type="button">List</button>
      <button id="show-class-detail" type="button">Details</button>
    </nav>

    <section class="explorer-layout">
      <aside class="search-panel" aria-label="Class search">
        <div class="search-box">
          <label for="class-search">Search</label>
          <input id="class-search" type="search" autocomplete="off" placeholder="Type a graph class or parameter..." />
        </div>
        <div id="class-list" class="class-list"></div>
      </aside>

      <section class="detail-panel" aria-label="Selected class details">
        <div class="selected-header">
          <div>
            <p id="selected-group" class="eyebrow"></p>
            <h2 id="selected-title"></h2>
            <div id="selected-properties" class="property-tags" hidden></div>
          </div>
        </div>
        <p id="selected-summary" class="selected-summary"></p>

        <div class="relation-grid">
          <section class="relation-card">
            <button class="relation-card-head" type="button" aria-expanded="false">
              <h3>Equivalent</h3>
              <span id="equivalent-count"></span>
            </button>
            <div id="equivalent-list" class="relation-list"></div>
          </section>
          <section class="relation-card">
            <button class="relation-card-head" type="button" aria-expanded="false">
              <h3>Subclasses</h3>
              <span id="subclass-count"></span>
            </button>
            <div id="subclass-list" class="relation-list"></div>
          </section>
          <section class="relation-card">
            <button class="relation-card-head" type="button" aria-expanded="false">
              <h3>Superclasses</h3>
              <span id="superclass-count"></span>
            </button>
            <div id="superclass-list" class="relation-list"></div>
          </section>
        </div>

        <section class="local-map-card">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Relation View</p>
              <h2 id="relation-view-title"></h2>
            </div>
            <div class="graph-actions" aria-label="Local graph controls">
              <button class="graph-view-button active" type="button" data-view="all">Local</button>
              <button class="graph-view-button" type="button" data-view="subclasses">Subclasses</button>
              <button class="graph-view-button" type="button" data-view="superclasses">Superclasses</button>
              <button class="graph-view-button" type="button" data-view="equivalent">Equivalent</button>
              <button id="fit-graph" type="button">Fit</button>
              <button id="reset-graph" type="button">Reset</button>
              <label class="zoom-control" for="zoom-slider">
                <span>Zoom</span>
                <input id="zoom-slider" type="range" min="18" max="240" value="100" />
              </label>
            </div>
          </div>
          <div id="class-graph" class="class-graph"></div>
        </section>

        <section id="relation-sources" class="relation-sources" aria-labelledby="relation-sources-title">
          <div class="relation-sources-heading">
            <h3 id="relation-sources-title">Relation sources</h3>
            <select id="relation-source-select" aria-label="Relation to cite"></select>
          </div>
          <div id="relation-evidence" aria-live="polite"></div>
        </section>

        <section id="complexity" class="complexity-section" aria-labelledby="complexity-title">
          <div class="complexity-heading">
            <h2 id="complexity-title">Complexity <span id="complexity-class-label"></span></h2>
            <time datetime="2026-10-26">26 Oct 2026</time>
          </div>
          <dl id="complexity-parameters" class="complexity-parameters" aria-label="Parameters in parentheses"></dl>
          <div class="complexity-columns">
            <section class="complexity-group" aria-labelledby="graph-problems-title">
              <div class="complexity-group-heading">
                <h3 id="graph-problems-title">Graph problems</h3>
                <div class="complexity-form-tabs" role="tablist" aria-label="Problem form">
                  <button id="complexity-optimization-tab" class="complexity-form-tab" type="button" role="tab" aria-selected="true" aria-controls="complexity-problem-panel" data-form="optimization">Optimization</button>
                  <button id="complexity-decision-tab" class="complexity-form-tab" type="button" role="tab" aria-selected="false" aria-controls="complexity-problem-panel" tabindex="-1" data-form="decision">Decision</button>
                </div>
              </div>
              <div id="complexity-problem-panel" role="tabpanel" aria-labelledby="complexity-optimization-tab">
                <table class="complexity-table">
                  <colgroup><col class="problem-column" /><col class="result-column" /><col class="paper-column" /></colgroup>
                  <thead><tr><th scope="col">Problem</th><th scope="col">Complexity</th><th scope="col">Paper</th></tr></thead>
                  <tbody id="complexity-problems"></tbody>
                </table>
              </div>
            </section>
            <section class="complexity-group" aria-labelledby="model-checking-title">
              <h3 id="model-checking-title">Model checking</h3>
              <table class="complexity-table">
                <colgroup><col class="problem-column" /><col class="result-column" /><col class="paper-column" /></colgroup>
                <thead><tr><th scope="col">Logic</th><th scope="col">Complexity</th><th scope="col">Paper</th></tr></thead>
                <tbody id="complexity-logic"></tbody>
              </table>
            </section>
          </div>
        </section>
      </section>

    </section>
  </main>
</body>
</html>
